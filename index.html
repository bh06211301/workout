<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#16181c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<title>訓練菜單</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#16181c; --surface:#20242b; --surface2:#2a2f38; --line:#333944;
    --bone:#ECE7DE; --muted:#8a8f99; --amber:#F5A623;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--bone);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;-webkit-font-smoothing:antialiased;}
  body{padding:28px 16px 40px;max-width:560px;margin:0 auto;}

  .eyebrow{font-size:12px;letter-spacing:.28em;color:var(--muted);text-transform:uppercase;margin:0 0 4px}
  h1{font-family:"Oswald";font-weight:600;font-size:30px;letter-spacing:.02em;margin:0 0 26px}

  .day{display:block;background:var(--surface);border:1px solid var(--line);border-radius:14px;
    padding:18px 16px;margin-bottom:12px;text-decoration:none;color:inherit;
    display:flex;align-items:center;gap:14px;transition:background .15s ease}
  .day:active{background:var(--surface2)}
  .day .tag{font-family:"Oswald";font-weight:700;font-size:20px;color:var(--amber);flex:0 0 auto;width:34px}
  .day .info{flex:1;min-width:0}
  .day .name{font-size:16px;font-weight:600}
  .day .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
  .day .arrow{color:var(--muted);font-size:18px;flex:0 0 auto}
</style>
</head>
<body>
  <p class="eyebrow">Workout</p>
  <h1>訓練菜單</h1>

  <a class="day" href="day-a.html">
    <span class="tag">A</span>
    <span class="info"><span class="name">肩 + 背</span><span class="sub">8 動作 · 27 組</span></span>
    <span class="arrow">›</span>
  </a>

  <a class="day" href="day-b.html">
    <span class="tag">B</span>
    <span class="info"><span class="name">胸 + 手臂</span><span class="sub">7 動作 · 22 組</span></span>
    <span class="arrow">›</span>
  </a>

  <a class="day" href="day-c.html">
    <span class="tag">C</span>
    <span class="info"><span class="name">腿 + 核心</span><span class="sub">7 動作 · 24 組</span></span>
    <span class="arrow">›</span>
  </a>
</body>
</html>
