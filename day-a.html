<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#16181c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<title>Day A · 肩 + 背</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#16181c; --surface:#20242b; --surface2:#2a2f38; --line:#333944;
    --bone:#ECE7DE; --muted:#8a8f99;
    --steel:#6fa0be; --amber:#F5A623; --amber-hot:#ff8a00; --done:#8bbf6e;
    --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--bone);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;-webkit-font-smoothing:antialiased;}
  body{padding:0 16px 120px;max-width:560px;margin:0 auto;}
  input,textarea{font-family:inherit}

  header{position:sticky;top:0;background:linear-gradient(var(--bg) 82%,transparent);padding:16px 0 10px;z-index:5;}
  .toprow{display:flex;justify-content:space-between;align-items:flex-start}
  .eyebrow{font-size:12px;letter-spacing:.28em;color:var(--muted);text-transform:uppercase;margin:0 0 2px}
  .backlink{font-size:12px;color:var(--muted);text-decoration:none;display:inline-block;margin-bottom:6px}
  .title{font-family:"Oswald";font-weight:600;font-size:33px;letter-spacing:.02em;margin:0;line-height:1}
  .title .plus{color:var(--amber)}
  .unit{display:flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;flex:0 0 auto}
  .unit button{background:none;border:none;color:var(--muted);font-family:"Oswald";font-weight:600;font-size:14px;padding:7px 13px}
  .unit button.act{background:var(--amber);color:#16181c}
  .metarow{display:flex;align-items:center;gap:10px;margin-top:14px}
  .progresswrap{flex:1}
  .progresslabel{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:5px}
  .progresslabel b{color:var(--bone);font-family:"Oswald";font-weight:600;font-size:14px}
  .bar{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden}
  .bar>i{display:block;height:100%;width:100%;transform:scaleX(0);transform-origin:left;background:linear-gradient(90deg,var(--amber),var(--amber-hot));border-radius:99px;transition:transform .35s ease}
  .hbtn{background:none;border:1px solid var(--line);color:var(--muted);font-size:12px;padding:8px 11px;border-radius:99px;flex:0 0 auto}
  .hbtn:active{background:var(--surface)}
  .hbtn.exp{border-color:var(--amber);color:var(--amber)}
  .pushrow{margin-top:8px}
  .pushbtn{width:100%;text-align:center;border-radius:10px;padding:9px 11px}
  .pushbtn.on{border-color:var(--done);color:var(--done)}

  .sec{margin:24px 0 12px;display:flex;align-items:center;gap:12px}
  .sec .tag{font-family:"Oswald";font-weight:700;font-size:22px;letter-spacing:.05em;padding:2px 12px;border-radius:8px;line-height:1.4}
  .sec.shoulder .tag{background:rgba(245,166,35,.14);color:var(--amber)}
  .sec.back .tag{background:rgba(111,160,190,.16);color:var(--steel)}
  .sec .rule{flex:1;height:1px;background:var(--line)}
  .sec .cnt{font-size:12px;color:var(--muted)}

  .warm{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:13px 16px;margin-top:6px}
  .warm h3{margin:0 0 5px;font-size:14px;display:flex;align-items:center;gap:8px}
  .warm h3 span{color:var(--muted);font-weight:400;font-size:12px}
  .warm p{margin:0;font-size:13px;line-height:1.55;color:var(--muted)}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px 15px 14px;margin-bottom:12px;transition:opacity .3s,border-color .3s}
  .card.done{opacity:.55;border-color:var(--done)}
  .card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .card .name{font-size:17px;font-weight:600;line-height:1.3}
  .card .idx{font-family:"Oswald";font-weight:700;font-size:15px;flex:0 0 auto;width:20px;text-align:right}
  .card.shoulder .idx{color:var(--amber)} .card.back .idx{color:var(--steel)}
  .meta{margin:7px 0 2px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;font-size:12.5px;color:var(--muted)}
  .meta .goal{color:var(--bone)} .meta .rest b{color:var(--amber);font-family:"Oswald";font-weight:600}
  .meta .rest{margin-left:auto}

  .cuebtn{margin-top:9px;background:none;border:1px solid var(--line);color:var(--muted);font-size:12.5px;padding:6px 11px;border-radius:8px;letter-spacing:.03em}
  .cuebtn:active{background:var(--surface2)}
  .detail{margin-top:10px;padding:11px 12px;background:var(--surface2);border-radius:10px;border-left:2px solid var(--amber)}
  .card.back .detail{border-left-color:var(--steel)}
  .detail.hide{display:none}
  .drow{font-size:12.5px;line-height:1.6;color:var(--muted);margin:0 0 5px}
  .drow:last-child{margin-bottom:0}
  .drow .dl{color:var(--bone);font-weight:600;margin-right:5px}
  .card.shoulder .drow .dl{color:var(--amber)} .card.back .drow .dl{color:var(--steel)}

  .setrow{display:grid;grid-template-columns:20px 1fr 1fr 46px;gap:8px;align-items:center;margin-top:10px}
  .setrow .sn{font-family:"Oswald";font-weight:600;font-size:14px;color:var(--muted);text-align:center}
  .field{display:flex;align-items:center;background:var(--surface2);border:1px solid var(--line);border-radius:10px;height:44px;overflow:hidden}
  .field .stp{width:30px;height:100%;background:none;border:none;color:var(--muted);font-size:20px;font-family:"Oswald";flex:0 0 auto}
  .field .stp:active{background:rgba(255,255,255,.06);color:var(--bone)}
  .field input{flex:1;min-width:0;width:100%;background:none;border:none;color:var(--bone);text-align:center;font-family:"Oswald";font-weight:600;font-size:17px;padding:0;outline:none;font-variant-numeric:tabular-nums}
  .field .u{font-size:11px;color:var(--muted);padding-right:9px;flex:0 0 auto}
  .chk{height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface2);color:var(--muted);font-size:19px;display:flex;align-items:center;justify-content:center;transition:transform .08s,background .2s,color .2s,border-color .2s}
  .chk:active{transform:scale(.92)}
  .chk.on{background:var(--done);border-color:var(--done);color:#16181c}

  /* rest overlay */
  .overlay{position:fixed;inset:0;background:rgba(12,13,16,.93);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
  .overlay.show{display:flex}
  .ovlabel{font-size:12px;letter-spacing:.3em;color:var(--muted);text-transform:uppercase;margin-bottom:4px}
  .ovexname{font-size:16px;margin-bottom:24px;max-width:280px}
  .ring{position:relative;width:244px;height:244px}
  .ring svg{transform:rotate(-90deg)}
  .ring .rem{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring .big{font-family:"Oswald";font-weight:700;font-size:76px;line-height:.9;color:var(--amber);font-variant-numeric:tabular-nums;text-shadow:0 0 26px rgba(255,138,0,.35)}
  .ring .unit2{font-size:13px;letter-spacing:.25em;color:var(--muted);margin-top:8px;text-transform:uppercase}
  .ovctrl{display:flex;gap:12px;margin-top:32px}
  .ovbtn{border:1px solid var(--line);background:var(--surface);color:var(--bone);font-family:"Oswald";font-weight:600;font-size:17px;padding:14px 22px;border-radius:12px;min-width:74px}
  .ovbtn:active{background:var(--surface2)}
  .ovbtn.skip{background:var(--amber);color:#16181c;border-color:var(--amber)}
  .ovnext{margin-top:24px;font-size:12.5px;color:var(--muted)} .ovnext b{color:var(--bone)}

  /* export modal */
  .modal{position:fixed;inset:0;background:rgba(12,13,16,.9);z-index:60;display:none;align-items:flex-end;justify-content:center;padding:0}
  .modal.show{display:flex}
  .sheet{background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:560px;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
  .sheet h3{margin:0 0 4px;font-size:16px}
  .sheet p{margin:0 0 12px;font-size:12px;color:var(--muted)}
  .sheet textarea{width:100%;height:210px;background:var(--bg);border:1px solid var(--line);border-radius:12px;color:var(--bone);font-size:13px;line-height:1.5;padding:12px;resize:none;font-variant-numeric:tabular-nums}
  .mbtns{display:flex;gap:10px;margin-top:12px}
  .mbtns button{flex:1;border-radius:12px;padding:14px;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface2);color:var(--bone)}
  .mbtns .copy{background:var(--amber);color:#16181c;border-color:var(--amber)}

  .footnote{text-align:center;color:var(--muted);font-size:12px;line-height:1.6;margin-top:24px;padding:0 6px}
  @media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="toprow">
    <div><a class="backlink" href="index.html">‹ 選單</a><p class="eyebrow">Workout · Day A</p><h1 class="title osw">肩 <span class="plus">+</span> 背</h1></div>
    <div class="unit">
      <button id="uKg" onclick="setUnit('kg')">公斤</button>
      <button id="uLb" onclick="setUnit('lb')">磅</button>
    </div>
  </div>
  <div class="metarow">
    <div class="progresswrap">
      <div class="progresslabel"><span>今日進度</span><b><span id="pDone">0</span> / <span id="pTotal">27</span> 組</b></div>
      <div class="bar"><i id="pBar"></i></div>
    </div>
    <button class="hbtn exp" onclick="openExp()">匯出文字</button>
    <button class="hbtn" onclick="resetAll()">重設</button>
  </div>
  <div class="pushrow"><button class="hbtn pushbtn" id="pushBtn" onclick="enablePush()">🔔 開啟休息提醒通知</button></div>
</header>

<div class="warm">
  <h3>熱身 <span>5–8 分鐘</span></h3>
  <p>肩繞環、貓牛；輕重量側平舉 ＋ 划船各 1 組帶開肩背。</p>
</div>

<div class="sec shoulder"><span class="tag osw">肩</span><span class="rule"></span><span class="cnt">4 動作 · 14 組</span></div>
<div id="secShoulder"></div>

<div class="sec back"><span class="tag osw">背</span><span class="rule"></span><span class="cnt">4 動作 · 13 組</span></div>
<div id="secBack"></div>

<p class="footnote">點「要領」看每個動作的細節；每組可用 −／＋ 或直接輸入。<br>收操後按「匯出文字」→ 複製貼回 Claude 幫你分析。</p>

<div class="overlay" id="overlay">
  <p class="ovlabel">休息中</p>
  <p class="ovexname" id="ovEx">—</p>
  <div class="ring">
    <svg width="244" height="244" viewBox="0 0 244 244">
      <circle cx="122" cy="122" r="110" fill="none" stroke="#2a2f38" stroke-width="10"/>
      <circle id="ovRing" cx="122" cy="122" r="110" fill="none" stroke="url(#g)" stroke-width="10" stroke-linecap="round" stroke-dasharray="691.15" stroke-dashoffset="0"/>
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F5A623"/><stop offset="1" stop-color="#ff8a00"/></linearGradient></defs>
    </svg>
    <div class="rem"><div class="big" id="ovNum">90</div><div class="unit2">秒</div></div>
  </div>
  <div class="ovctrl">
    <button class="ovbtn" onclick="bump(-15)">−15</button>
    <button class="ovbtn skip" onclick="skipRest()">跳過</button>
    <button class="ovbtn" onclick="bump(15)">＋15</button>
  </div>
  <p class="ovnext" id="ovNext"></p>
</div>

<div class="modal" id="expModal">
  <div class="sheet">
    <h3>今日數據</h3>
    <p>複製後貼回 Claude，跟他說「幫我分析」即可。</p>
    <textarea id="expText" readonly></textarea>
    <div class="mbtns">
      <button class="copy" onclick="copyExp()">複製</button>
      <button onclick="closeExp()">關閉</button>
    </div>
  </div>
</div>

<script>
const LB=2.2046226;
const SHOULDER=[
  {n:"坐姿啞鈴肩推",loLb:20,hiLb:25,rLo:10,rHi:13,sets:4,rest:90,restLbl:"75–90″",
   cues:["設定：背貼椅背、核心收緊，啞鈴起在耳側，手肘略前於身體約 30°。",
         "動作：往上推同時微內收，頂端不鎖死不聳肩；下放 2 秒回到耳高。",
         "常見錯誤：挺腰借力、手肘完全外開夾擠肩關節、頂端聳肩。",
         "呼吸：推起吐氣、下放吸氣。"]},
  {n:"側平舉",loLb:10,hiLb:15,rLo:15,rHi:20,sets:4,rest:60,restLbl:"45–60″",
   cues:["設定：微屈肘固定角度，小指略高（像倒水），身體微前傾。",
         "動作：用中束「帶」到與肩同高即可，頂端停一下、離心放慢。",
         "常見錯誤：聳肩、甩動借力、抬過肩線變上斜方發力。",
         "重點：想成往兩側倒、不是往上舉；寧輕勿重。"]},
  {n:"阿諾推舉",loLb:15,hiLb:20,rLo:12,rHi:15,sets:3,rest:75,restLbl:"60–75″",
   cues:["設定：起始掌心朝自己、啞鈴在胸口前（像彎舉頂端）。",
         "動作：推起過程掌心邊轉邊外旋，頂端朝前；下放反向旋回、可控。",
         "常見錯誤：旋轉太快失控、頂端鎖死聳肩。",
         "好處：旋轉延長前中束的刺激行程。"]},
  {n:"俯身反向飛鳥",loLb:10,hiLb:10,rLo:15,rHi:20,sets:3,rest:60,restLbl:"45–60″",
   cues:["設定：髖鉸鏈前傾 45–60°、背打直、微屈肘。",
         "動作：後三角把手往兩側畫弧抬起，頂端夾 1 秒再慢放。",
         "常見錯誤：用斜方／背闊代償（變成往後划船）、靠慣性甩。",
         "重點：想後三角、不是夾背；重量寧輕勿重。"]},
];
const BACK=[
  {n:"單臂啞鈴划船",loLb:25,hiLb:25,rLo:10,rHi:12,sets:4,rest:90,restLbl:"75–90″",sug:true,
   cues:["設定：單手單膝撐凳，背與地面平行、脊椎中立，啞鈴自然垂下、肩胛先下沉。",
         "動作：手肘貼身往後上拉到髖側，頂端夾 1 秒；下放完全伸展背闊。",
         "常見錯誤：軀幹旋轉借力、聳肩、只用手臂拉。",
         "呼吸：拉起吐氣、下放吸氣。"]},
  {n:"啞鈴俯身划船",loLb:20,hiLb:20,rLo:12,rHi:15,sets:3,rest:75,restLbl:"60–75″",sug:true,
   cues:["設定：髖鉸鏈前傾、背打直、膝微彎，兩手啞鈴垂於身前。",
         "動作：手肘貼身往腹部方向拉、擠壓中背，控制下放。",
         "常見錯誤：站太直變聳肩、下背拱起、用慣性。",
         "重點：核心穩住不晃、前傾角度固定。"]},
  {n:"啞鈴直臂上拉",loLb:15,hiLb:20,rLo:12,rHi:15,sets:3,rest:60,restLbl:"60″",sug:true,
   cues:["設定：上背橫躺於凳、臀微沉，雙手捧一顆啞鈴於胸口上方、手肘微彎固定。",
         "動作：手臂近打直往頭後下放到背闊/胸廓有延展，再用背闊拉回；下放 2 秒。",
         "常見錯誤：手肘一直凹折變三頭出力、下放過深壓迫肩。",
         "重點：感受背闊延展與收縮，不是手臂在動。"]},
  {n:"啞鈴聳肩",loLb:25,hiLb:25,rLo:15,rHi:20,sets:3,rest:60,restLbl:"45–60″",sug:true,
   cues:["設定：站直、啞鈴垂於體側，肩膀先放鬆下沉。",
         "動作：直接往上聳向耳朵、頂端夾 1 秒，慢慢放到底充分伸展。",
         "常見錯誤：往前繞圈、用手臂彎舉、下放不完全。",
         "重點：純上下、頂端停、離心放慢。"]},
];

let unit='lb';
const ALL=[], state=[];
function kgDefault(lb){ return Math.round(lb/LB*2)/2; }

function buildSection(list,mount,cls){
  list.forEach((ex,i)=>{
    const gi=ALL.length; ALL.push(ex);
    const rows=[]; state.push(rows);
    let cuesHtml='';
    ex.cues.forEach(c=>{ const k=c.indexOf('：');
      cuesHtml+=`<div class="drow"><span class="dl">${c.slice(0,k)}</span>${c.slice(k+1)}</div>`; });
    let sets='';
    for(let s=0;s<ex.sets;s++){
      rows.push({kg:kgDefault(ex.loLb),reps:ex.rLo,done:false});
      sets+=`<div class="setrow">
        <div class="sn">${s+1}</div>
        <div class="field"><button class="stp" onclick="stepW(${gi},${s},-1)">−</button>
          <input id="w${gi}_${s}" inputmode="decimal" onchange="onW(${gi},${s},this)">
          <span class="u" id="wu${gi}_${s}">磅</span>
          <button class="stp" onclick="stepW(${gi},${s},1)">＋</button></div>
        <div class="field"><button class="stp" onclick="stepR(${gi},${s},-1)">−</button>
          <input id="r${gi}_${s}" inputmode="numeric" onchange="onR(${gi},${s},this)">
          <span class="u">下</span>
          <button class="stp" onclick="stepR(${gi},${s},1)">＋</button></div>
        <button class="chk" id="c${gi}_${s}" onclick="toggle(${gi},${s})">✓</button>
      </div>`;
    }
    const card=document.createElement('div');
    card.className='card '+cls; card.id='card'+gi;
    card.innerHTML=`<div class="top"><div class="name">${ex.n}</div><div class="idx osw">${i+1}</div></div>
      <div class="meta"><span class="goal">目標 <span id="g${gi}"></span></span>
        <span>${ex.sets} 組 × ${ex.rLo}–${ex.rHi} 下</span>
        <span class="rest">休 <b>${ex.restLbl}</b></span></div>
      <button class="cuebtn" onclick="tgCue(${gi})" id="cb${gi}">要領 ▾</button>
      <div class="detail hide" id="d${gi}">${cuesHtml}</div>
      ${sets}`;
    mount.appendChild(card);
  });
}
buildSection(SHOULDER,document.getElementById('secShoulder'),'shoulder');
buildSection(BACK,document.getElementById('secBack'),'back');

const TOTAL=state.reduce((a,r)=>a+r.length,0);
document.getElementById('pTotal').textContent=TOTAL;

function tgCue(gi){
  const d=document.getElementById('d'+gi), b=document.getElementById('cb'+gi);
  const open=d.classList.toggle('hide')===false;
  b.textContent = open ? '要領 ▴' : '要領 ▾';
}

function showW(kg){ return unit==='kg' ? trim(Math.round(kg*2)/2) : Math.round(kg*LB); }
function trim(v){ return Number.isInteger(v)?String(v):v.toFixed(1); }
function goalStr(ex){ if(unit==='kg'){ const a=kgDefault(ex.loLb),b=kgDefault(ex.hiLb);
    return (a===b?trim(a):trim(a)+'–'+trim(b))+' 公斤'; }
  return (ex.loLb===ex.hiLb?ex.loLb:ex.loLb+'–'+ex.hiLb)+' 磅'; }
function renderAll(){
  document.getElementById('uKg').classList.toggle('act',unit==='kg');
  document.getElementById('uLb').classList.toggle('act',unit==='lb');
  ALL.forEach((ex,gi)=>{ document.getElementById('g'+gi).textContent=goalStr(ex);
    state[gi].forEach((set,s)=>{ document.getElementById('w'+gi+'_'+s).value=showW(set.kg);
      document.getElementById('wu'+gi+'_'+s).textContent=(unit==='kg'?'公斤':'磅');
      document.getElementById('r'+gi+'_'+s).value=set.reps; }); });
}
function setUnit(u){ unit=u; renderAll(); }

function onW(gi,s,el){ let v=parseFloat(el.value);
  if(isNaN(v)||v<0){ el.value=showW(state[gi][s].kg); return; }
  state[gi][s].kg = unit==='kg' ? v : v/LB; el.value=showW(state[gi][s].kg); }
function stepW(gi,s,d){ const set=state[gi][s];
  if(unit==='kg'){ set.kg=Math.max(0,Math.round((set.kg+d*0.5)*2)/2); }
  else{ let lb=Math.max(0,Math.round(set.kg*LB)+d); set.kg=lb/LB; }
  document.getElementById('w'+gi+'_'+s).value=showW(set.kg); }
function onR(gi,s,el){ let v=parseInt(el.value,10);
  if(isNaN(v)||v<0){ el.value=state[gi][s].reps; return; } state[gi][s].reps=v; }
function stepR(gi,s,d){ const set=state[gi][s]; set.reps=Math.max(0,set.reps+d);
  document.getElementById('r'+gi+'_'+s).value=set.reps; }

function toggle(gi,s){ const set=state[gi][s]; set.done=!set.done;
  document.getElementById('c'+gi+'_'+s).classList.toggle('on',set.done);
  document.getElementById('card'+gi).classList.toggle('done',state[gi].every(x=>x.done));
  updateProgress(); if(set.done) startRest(gi); }
function updateProgress(){ const done=state.reduce((a,r)=>a+r.filter(x=>x.done).length,0);
  document.getElementById('pDone').textContent=done;
  document.getElementById('pBar').style.transform='scaleX('+(done/TOTAL)+')'; }

/* rest */
let timer=null,restEndAt=0,curTotal=0,lastBeepSec=-1,activeJobId=null; const ringLen=691.15;
const ov=document.getElementById('overlay'),ovNum=document.getElementById('ovNum'),
      ovRing=document.getElementById('ovRing'),ovEx=document.getElementById('ovEx'),ovNext=document.getElementById('ovNext');
function computeRemain(){ return Math.max(0,Math.ceil((restEndAt-Date.now())/1000)); }
function startRest(gi){ const ex=ALL[gi]; if(activeJobId) cancelPush();
  restEndAt=Date.now()+ex.rest*1000; curTotal=ex.rest; ovEx.textContent=ex.n;
  const nx=nextPending(gi); ovNext.innerHTML=nx?`下一組：<b>${nx}</b>`:`最後一組，收操！`;
  ov.classList.add('show'); lastBeepSec=-1; clearInterval(timer); tickRest();
  timer=setInterval(tickRest,1000);
  schedulePush(ex.rest,ex.n,pushNextLabel(gi)); }
function tickRest(){ const remain=computeRemain();
  if(remain<=3&&remain>0&&remain!==lastBeepSec){ beep(880,.12); lastBeepSec=remain; }
  renderRing(remain); if(remain<=0) finishRest(); }
function pushNextLabel(gi){ if(!state[gi].every(x=>x.done)) return ALL[gi].n;
  for(let k=gi+1;k<ALL.length;k++){ if(!state[k].every(x=>x.done)) return ALL[k].n; } return '收操完成'; }
function renderRing(remain){ ovNum.textContent=remain; ovRing.style.strokeDashoffset=ringLen*(1-remain/curTotal); }
function bump(d){ restEndAt+=d*1000; const remain=computeRemain(); curTotal=Math.max(curTotal,remain); renderRing(remain);
  reschedulePush(d); }
function skipRest(){ clearInterval(timer); ov.classList.remove('show'); cancelPush(); }
function finishRest(){ clearInterval(timer); activeJobId=null;
  beep(660,.18);setTimeout(()=>beep(880,.18),200);setTimeout(()=>beep(1175,.32),400);
  ovNum.textContent=0; ovRing.style.strokeDashoffset=ringLen; setTimeout(()=>ov.classList.remove('show'),650); }
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&ov.classList.contains('show')) tickRest(); });
function nextPending(gi){ if(!state[gi].every(x=>x.done)) return ALL[gi].n+' 還有組';
  for(let k=gi+1;k<ALL.length;k++){ if(!state[k].every(x=>x.done)) return ALL[k].n; } return null; }

/* audio */
let actx=null;
function beep(f,d){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();
  const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;o.type='sine';
  o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.001,actx.currentTime);
  g.gain.exponentialRampToValueAtTime(.4,actx.currentTime+.02);
  g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);o.start();o.stop(actx.currentTime+d);}catch(e){}}
document.body.addEventListener('touchstart',()=>{if(actx&&actx.state==='suspended')actx.resume();});

/* push notification（休息倒數提醒，鎖屏/切到別的 App 也收得到；iPhone 需先加入主畫面） */
const PUSH_API='https://workout-push.bh06211301.workers.dev';
const VAPID_PUBLIC_KEY='BCqnaEpQEs6alLXynqNyAyjEjuZpAZ4V8ytjJY95y_AlJ12rWsPklHbLBzY-2HCIw0WUx5cipAIn8SdO9C7mhnw';
let pushSub=null;
function urlBase64ToUint8Array(base64String){
  const padding='='.repeat((4-base64String.length%4)%4);
  const base64=(base64String+padding).replace(/-/g,'+').replace(/_/g,'/');
  const raw=atob(base64); const arr=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) arr[i]=raw.charCodeAt(i);
  return arr;
}
function setPushBtnOn(){ const b=document.getElementById('pushBtn');
  b.textContent='🔔 休息提醒通知：已開啟'; b.classList.add('on'); }
async function setupPush(){
  if(!('serviceWorker' in navigator)||!('PushManager' in window)) return;
  try{ const reg=await navigator.serviceWorker.register('sw.js');
    const existing=await reg.pushManager.getSubscription();
    if(existing){ pushSub=existing.toJSON(); setPushBtnOn(); }
  }catch(e){}
}
async function enablePush(){
  if(!('serviceWorker' in navigator)||!('PushManager' in window)){
    alert('這台裝置/瀏覽器不支援推播通知。\n\niPhone 請先用 Safari 分享 → 加入主畫面，改從主畫面圖示打開這個 App，才能開啟鎖屏通知。');
    return;
  }
  if(pushSub) return;
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted') return;
    const reg=await navigator.serviceWorker.register('sw.js');
    const sub=await reg.pushManager.subscribe({ userVisibleOnly:true,
      applicationServerKey:urlBase64ToUint8Array(VAPID_PUBLIC_KEY) });
    pushSub=sub.toJSON(); setPushBtnOn();
  }catch(e){ console.error(e); alert('開啟通知失敗，請稍後再試一次。'); }
}
function schedulePush(restSeconds,exerciseName,nextLabel){
  activeJobId=null;
  if(!pushSub) return;
  fetch(PUSH_API+'/schedule-rest',{ method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({ subscription:pushSub, restSeconds, exerciseName, nextLabel }) })
    .then(r=>r.json()).then(d=>{ if(d&&d.id) activeJobId=d.id; }).catch(()=>{});
}
function reschedulePush(deltaSeconds){
  if(!activeJobId) return;
  fetch(PUSH_API+'/reschedule-rest',{ method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({ id:activeJobId, deltaSeconds }) }).catch(()=>{});
}
function cancelPush(){
  if(!activeJobId) return; const id=activeJobId; activeJobId=null;
  fetch(PUSH_API+'/cancel-rest',{ method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({ id }) }).catch(()=>{});
}
setupPush();

/* export */
function buildExport(){
  const d=new Date(), pad=n=>String(n).padStart(2,'0');
  const date=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const uLabel = unit==='kg'?'公斤':'磅';
  let t=`Day A · 肩+背｜${date}\n單位：${uLabel}、單邊（每手一顆）\n`;
  const sec=(title,arr,base)=>{ t+=`\n【${title}】\n`;
    arr.forEach((ex,i)=>{ const gi=base+i;
      const done=state[gi].filter(x=>x.done);
      const logged=done.length? done.map(x=>`${showW(x.kg)}/${x.reps}`).join('、') : '（未記錄）';
      t+=`${i+1} ${ex.n}（目標 ${ex.rLo}–${ex.rHi} 下）：${logged}\n`; }); };
  sec('肩',SHOULDER,0); sec('背',BACK,SHOULDER.length);
  t+=`\n—— 進階規則：連兩次所有組打到區間上限→加 5 磅；到 25 磅封頂改強度技巧（慢離心／頂端停／末組遞減／休息縮 45 秒）。請依此分析並建議下次調整。`;
  return t;
}
function openExp(){ document.getElementById('expText').value=buildExport();
  document.getElementById('expModal').classList.add('show'); }
function closeExp(){ document.getElementById('expModal').classList.remove('show'); }
function copyExp(){ const ta=document.getElementById('expText'); const txt=ta.value;
  const done=()=>{ const b=document.querySelector('.mbtns .copy'); const o=b.textContent;
    b.textContent='已複製 ✓'; setTimeout(()=>b.textContent=o,1400); };
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done,()=>{ta.select();document.execCommand('copy');done();}); }
  else { ta.select(); ta.setSelectionRange(0,99999); document.execCommand('copy'); done(); } }

function resetAll(){ if(!confirm('清空今天所有已完成的組數？（重量與次數會保留）')) return;
  state.forEach((rows,gi)=>{ rows.forEach((set,s)=>{ set.done=false;
    document.getElementById('c'+gi+'_'+s).classList.remove('on'); });
    document.getElementById('card'+gi).classList.remove('done'); });
  updateProgress(); skipRest(); }

/* ---- 暫存：localStorage 自動存檔 ---- */
const SKEY='dayA_v1';
function saveState(){ try{
  localStorage.setItem(SKEY,JSON.stringify({unit,
    data:state.map(rows=>rows.map(x=>({kg:x.kg,reps:x.reps,done:x.done})))}));
}catch(e){} }
function loadState(){ try{
  const raw=localStorage.getItem(SKEY); if(!raw) return false;
  const p=JSON.parse(raw); if(!p||!Array.isArray(p.data)||p.data.length!==state.length) return false;
  if(p.unit) unit=p.unit;
  p.data.forEach((rows,gi)=>{ if(!Array.isArray(rows)||rows.length!==state[gi].length) return;
    rows.forEach((x,s)=>{ if(x&&typeof x.kg==='number'){
      state[gi][s].kg=x.kg; state[gi][s].reps=x.reps; state[gi][s].done=!!x.done; } }); });
  return true;
}catch(e){ return false; } }
function refreshUI(){ renderAll();
  ALL.forEach((ex,gi)=>{ state[gi].forEach((set,s)=>{
      document.getElementById('c'+gi+'_'+s).classList.toggle('on',set.done); });
    document.getElementById('card'+gi).classList.toggle('done',state[gi].every(x=>x.done)); });
  updateProgress(); }

function applySeed(){ const P=lb=>lb/LB;
  // 今天已回報（磅，單邊）：肩推 20/12、20/13、20/12、25/7；側平舉 10/13、15/8、15/10、10/10
  state[0][0]={kg:P(20),reps:12,done:true}; state[0][1]={kg:P(20),reps:13,done:true};
  state[0][2]={kg:P(20),reps:12,done:true}; state[0][3]={kg:P(25),reps:7 ,done:true};
  state[1][0]={kg:P(10),reps:13,done:true}; state[1][1]={kg:P(15),reps:8 ,done:true};
  state[1][2]={kg:P(15),reps:10,done:true}; state[1][3]={kg:P(10),reps:10,done:true}; }

/* init：優先讀存檔，沒有才帶入今天已回報的數據 */
if(!loadState()) applySeed();
refreshUI(); saveState();

/* 自動存檔：輸入變動、按鈕點擊、切走或鎖屏時 */
document.addEventListener('change',saveState);
document.addEventListener('click',()=>setTimeout(saveState,0));
window.addEventListener('pagehide',saveState);
document.addEventListener('visibilitychange',()=>{ if(document.hidden) saveState(); });
</script>
